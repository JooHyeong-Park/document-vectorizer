[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "document-vectorizer"
version = "0.1.0"
description = "Extract, chunk, embed, and persist Azure Blob documents."
requires-python = ">=3.13"

# Runtime, adapter, and test dependencies are maintained only in
# requirements/*.in and their environment-specific lock files.

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
